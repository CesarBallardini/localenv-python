line-length = 119
target-version = "py314"

[lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C90",          # mccabe complexity -- honors [lint.mccabe] max-complexity below
    "S",            # flake8-bandit
    "SIM",          # flake8-simplify
    "RET",          # flake8-return
    "PIE",          # flake8-pie
    "TCH",          # flake8-type-checking
    "YTT",          # flake8-2020
    "D",            # pydocstyle
    "ANN",          # flake8-annotations
    "ARG",          # unused arguments
    "PL",           # pylint
    "FLY",          # flynt: static join to f-string
    "RUF",          # ruff-specific rules
    "T20",          # print() left in the code
]
ignore = [
    "D203",  # one-blank-line-before-class -- conflicts with D211
    "D213",  # multi-line-summary-second-line -- conflicts with D212
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# assert is the idiomatic way to write a test assertion; it's disallowed
# in application code because `python -O` strips asserts at runtime.
"tests/**" = ["S101", "D"]
"fuzz/**" = ["S101"]

[format]
quote-style = "single"
