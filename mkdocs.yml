site_name: localenv-python
site_description: Tooling-first scaffold for a Python backend project.
repo_url: https://github.com/CesarBallardini/localenv-python
repo_name: CesarBallardini/localenv-python

# Warnings are failures. A renamed function silently orphans an API anchor
# otherwise, and the docs rot without the build ever going red.
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - API reference: reference.md
