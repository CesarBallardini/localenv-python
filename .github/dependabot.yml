version: 2

updates:
  # Grouping collapses a week's worth of bumps into one PR per ecosystem, so
  # the CI, security and coverage gates run once over the whole batch instead
  # of once per dependency.
  #
  # cooldown holds a release for 10 days before proposing it -- long enough for
  # a compromised or broken publish to be yanked upstream before it reaches a
  # branch here.
  #
  # Commented out until 2026-11-13: the eMudhra certificate advisory of
  # 2026-10-20 named releases younger than 10 days. Uncomment every block then.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
    # cooldown:
    #   default-days: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
    # cooldown:
    #   default-days: 10

  # Keeps the SHA-pinned `uses:` in the composite actions under
  # .github/actions/ updated too -- Dependabot does not find them via the
  # workflows directory alone.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/install-uv"
    schedule:
      interval: "weekly"
    # cooldown:
    #   default-days: 10

  # The FROM lines in the Dockerfile: the tag and the digest move together.
  #
  # Neither bump can land alone. A Python bump fails the test until .python-version
  # moves with it, and a uv bump fails it until the composite actions do.
  #
  # Python takes patch releases only: a new minor also means changing requires-python
  # and the versions in ruff.toml, pyrightconfig.json and pyrefly.toml. Node stays on
  # its major line, the one the markdown-link-check hook pins.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    # cooldown:
    #   default-days: 10

  # pre-commit hook revs (cooldown is not supported for this ecosystem).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
