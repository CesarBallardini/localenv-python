name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      # --cov-config makes the .coveragerc gate explicit rather than relying on
      # coverage's file discovery; fail_under = 90 in that file is what turns a
      # coverage drop into a failed build.
      - name: Run tests with coverage
        run: >-
          uv run --frozen pytest -n auto
          --cov=task_list
          --cov-config=.coveragerc
          --cov-report=xml
          --cov-report=term-missing
