name: security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every group, Atheris included: pip-audit checks what is installed.
      - uses: ./.github/actions/setup-python
        with:
          sync-args: "--all-groups --frozen"

      - name: SAST (bandit)
        run: uv run --frozen bandit -c bandit.yaml -r src

      - name: Dependency audit (pip-audit)
        run: uv run --frozen pip-audit --skip-editable

  # Licenses. FOSSA is the commercial answer here; pip-licenses covers the part
  # that actually matters for an MIT project at this size.
  #
  # The gate deliberately runs over the *runtime* closure only: nothing else is
  # distributed, so nothing else creates a licensing obligation. The dev
  # toolchain is reported but not gated -- Faker pulls in text-unidecode, which
  # offers GPLv2+ alongside the Artistic License, and it never ships.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every group, Atheris included: this reports what is installed.
      - uses: ./.github/actions/setup-python
        with:
          sync-args: "--all-groups --frozen"

      - name: Report the licenses of the whole toolchain
        run: |
          {
            echo "## Dependency licenses"
            echo
            uv run --frozen pip-licenses --format=markdown --with-urls
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate the licenses of the distributed dependencies
        run: |
          set -euo pipefail
          runtime=$(uv export --frozen --no-dev --no-emit-project --no-hashes                       --format requirements.txt                     | sed -e 's/[[:space:]]*[;#].*$//' -e 's/[=<>!~].*$//' -e '/^$/d'                     | paste -sd' ' -)

          if [ -z "$runtime" ]; then
            echo "No runtime dependencies to check; nothing is distributed yet."
            exit 0
          fi

          echo "Checking: $runtime"
          uv run --frozen pip-licenses --packages $runtime             --fail-on="GNU General Public License (GPL);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 or later (AGPLv3+)"

  # gitleaks is a Go binary, not a PyPI package, so it cannot go through uv.
  # The version is pinned to match the hook rev in .pre-commit-config.yaml so
  # CI and a local commit scan with the same ruleset.
  #
  # The pre-commit hook only ever sees staged changes
  # (`gitleaks git --pre-commit --staged`), which is a no-op in CI -- so this
  # job scans the whole working tree instead.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built here because the release binary sits below the eMudhra floor, on Go 1.24.11.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan the working tree for secrets
        run: gitleaks dir . --redact --verbose -c .gitleaks.toml

  # osv-scanner is likewise a standalone Go binary, wired in as Google's
  # official reusable workflow so it scans uv.lock directly and uploads its
  # findings to the code-scanning dashboard as SARIF.
  #
  # v2.7.0 of this action is built on Go 1.27.0, below the eMudhra floor, and there
  # is no newer release yet. The devcontainer workflow runs the same scan on a build
  # at the floor, so that required check still holds if this one is misled.
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=./uv.lock
